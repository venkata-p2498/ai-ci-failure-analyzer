
name: AI CI Failure Analyzer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests -v 2>&1 | tee failure.log

      - name: Send failure event to n8n
        if: ${{ always() }}
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          log_file = Path("failure.log")

          logs = (
              log_file.read_text(errors="replace")
              if log_file.exists()
              else "No test log was generated."
          )

          payload = {
              "repository": os.environ["REPOSITORY"],
              "run_id": os.environ["RUN_ID"],
              "run_url": os.environ["RUN_URL"],
              "commit_sha": os.environ["COMMIT_SHA"],
              "job_status": os.environ["JOB_STATUS"],
              "logs": logs[-15000:]
          }

          request = urllib.request.Request(
              os.environ["N8N_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              print("n8n response:", response.status)
          PY
